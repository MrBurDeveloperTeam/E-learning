<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      (function () {
        var validThemes = { light: true, dark: true, system: true };
        function normalizeTheme(value) {
          if (!value) return null;
          var raw = String(value).trim();
          try {
            var parsed = JSON.parse(raw);
            if (typeof parsed === 'string') raw = parsed;
            else if (parsed && parsed.state && parsed.state.theme) raw = parsed.state.theme;
            else if (parsed && parsed.theme) raw = parsed.theme;
          } catch (error) {}
          raw = String(raw).trim().toLowerCase();
          return validThemes[raw] ? raw : null;
        }
        function readCookie(name) {
          var parts = document.cookie ? document.cookie.split(';') : [];
          for (var i = 0; i < parts.length; i += 1) {
            var part = parts[i].trim();
            if (part.indexOf(name + '=') === 0) return decodeURIComponent(part.slice(name.length + 1));
          }
          return null;
        }
        function getSystemTheme() {
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        function resolveTheme(theme) {
          return theme === 'system' ? getSystemTheme() : (theme === 'dark' ? 'dark' : 'light');
        }
        function safeGet(key) {
          try { return window.localStorage.getItem(key); } catch (error) { return null; }
        }
        var preferredTheme = normalizeTheme(readCookie('snabbb-theme')) ||
          normalizeTheme(window.__SNABBB_THEME__) ||
          normalizeTheme(safeGet('snabbb-theme')) ||
          normalizeTheme(safeGet('theme')) ||
          normalizeTheme(safeGet('vite-ui-theme')) ||
          'light';
        var resolvedTheme = resolveTheme(preferredTheme);
        window.__SNABBB_THEME__ = preferredTheme;
        document.documentElement.setAttribute('data-theme', resolvedTheme);
        document.documentElement.setAttribute('data-theme-preference', preferredTheme);
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(resolvedTheme);
        document.documentElement.style.colorScheme = resolvedTheme;
      })();
    </script>

    <!-- Primary meta -->
    <title>DentalLearn — Dental Video Community</title>
    <meta name="description"
          content="Watch and share clinical dental videos. A professional community for dentists, specialists, and dental professionals across Malaysia and Southeast Asia." />
    <meta name="keywords"
          content="dental education, dental videos, dental CPD, dentist Malaysia, dental community, clinical dentistry, dental training" />
    <meta name="author" content="DentalLearn" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DentalLearn — Dental Video Community" />
    <meta property="og:description"
          content="Watch and share clinical dental videos from verified dental professionals." />
    <meta property="og:url" content="https://dentallearn.com" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="en_MY" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DentalLearn — Dental Video Community" />
    <meta name="twitter:description"
          content="Watch and share clinical dental videos from verified dental professionals." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Theme colour (browser chrome on mobile) -->
    <meta name="theme-color" content="#88C1BD" />

    <!-- Apple mobile web app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DentalLearn" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://stream.mux.com" />
    <style id="ls-css">html{--ls-bg:#F3F6F8;--ls-fg:#172B4D;--ls-ring:rgba(23,43,77,.12);--ls-accent:#2A9D8F;--ls-muted:#64748B}
html[data-theme="dark"]{--ls-bg:#0F1115;--ls-fg:#F1F5F9;--ls-ring:rgba(255,255,255,.18);--ls-accent:#5EEAD4;--ls-muted:#94A3B8}
.ls{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px;padding-top:max(32px,env(safe-area-inset-top));padding-bottom:max(32px,env(safe-area-inset-bottom));text-align:center;background:var(--ls-bg);color:var(--ls-fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:400;font-size:16px;line-height:1.2;letter-spacing:normal;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%}
.ls,.ls *{box-sizing:border-box;margin:0;padding:0}
.ls{padding:32px;padding-top:max(32px,env(safe-area-inset-top));padding-bottom:max(32px,env(safe-area-inset-bottom))}
.ls-icon{width:min(36vw,160px);height:min(36vw,160px);max-width:none;object-fit:contain;border-radius:22%}
.ls-spinner{width:min(16vw,72px);height:min(16vw,72px);border-radius:50%;border:6px solid var(--ls-ring);border-top-color:var(--ls-accent);animation:ls-spin .8s linear infinite}
.ls-title{margin:0;padding:0;font-family:inherit;font-size:clamp(1.75rem,8vw,2.5rem);font-weight:700;line-height:1.2;letter-spacing:normal;text-transform:none}
.ls-status{margin:0;padding:0;min-height:1.5em;font-family:inherit;font-size:clamp(1rem,4vw,1.125rem);font-weight:400;line-height:1.5;letter-spacing:normal;color:var(--ls-muted)}
@keyframes ls-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ls-spinner{animation-duration:2.4s}}</style>
  </head>
  <body>
    <div id="root"><div class="ls" role="status" aria-live="polite"><img class="ls-icon" src="https://app.snabbb.com/icons/new-icons/e-learning.png?v=2" alt="" width="160" height="160"><div class="ls-spinner" aria-hidden="true"></div><h1 class="ls-title">Opening E-Learning…</h1><p class="ls-status">Signing you in…</p></div></div>
    <script>
      (function () {
        if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;

        function showBootError(message) {
          var root = document.getElementById('root');
          if (!root || root.querySelector(':scope > :not(.ls)')) return;
          root.innerHTML =
            '<main style="min-height:100vh;padding:32px;background:#f7fafa;color:#1e3333;font-family:system-ui,sans-serif">' +
              '<div style="max-width:760px;margin:40px auto;padding:24px;border:1px solid #d6e0e0;border-radius:16px;background:white">' +
                '<h1 style="margin:0 0 12px;font-size:20px">Local app failed to start</h1>' +
                '<p style="margin:0 0 16px;color:#6b8e8e">Copy the error below so it can be fixed:</p>' +
                '<pre style="overflow:auto;white-space:pre-wrap;padding:16px;border-radius:10px;background:#101827;color:#f8fafc">' +
                  String(message).replace(/[&<>]/g, function (character) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[character]; }) +
                '</pre>' +
              '</div>' +
            '</main>';
        }

        window.addEventListener('error', function (event) {
          showBootError(event.error && event.error.stack ? event.error.stack : event.message);
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          showBootError(reason && reason.stack ? reason.stack : reason);
        });
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) {
            showBootError('React did not mount within 5 seconds. Open Chrome DevTools → Console for any blocked module request.');
          }
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
